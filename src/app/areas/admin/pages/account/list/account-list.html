<div class="card">

    <p-table #dt [value]="users()" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="id"
        currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} usuários"
        [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 20, 30]">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <h5 class="m-0">Usuários</h5>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th pSortableColumn="name">
                    Nome
                    <p-sortIcon field="Nome" />
                </th>
                <th pSortableColumn="email">
                    E-mail
                    <p-sortIcon field="email" />
                </th>
                <th pSortableColumn="role" style="min-width:10rem">
                    Perfil
                    <p-sortIcon field="role" />
                </th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.role }}</td>
                <td>
                    <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                        (click)="onEdit(user)" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                        (click)="onDelete(user)" />
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-confirmdialog [style]="{ width: '450px' }" />
</div>
