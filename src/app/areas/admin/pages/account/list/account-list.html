<div class="card">

    <p-table #dt [value]="users()" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="id" sortField="name"
        currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} usuários"
        [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 20, 30]">

        <ng-template pTemplate="caption">
            <div class="flex items-center justify-between">
                <h5 class="m-0">Usuários</h5>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">
                    Nome
                    <p-sortIcon field="name"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell" pSortableColumn="email">
                    E-mail
                    <p-sortIcon field="email"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell" pSortableColumn="role">
                    Perfil
                    <p-sortIcon field="role"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell text-right" style="width: 110px;">
                </th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
            <tr>

                <!-- Nome + Mobile -->
                <td>
                    <!-- Desktop -->
                    <div class="hidden md:block">
                        {{ user.name }}
                    </div>

                    <!-- Mobile -->
                    <div class="md:hidden">
                        <div class="font-bold">
                            {{ user.name }}
                        </div>

                        <div>
                            {{ user.email }}
                        </div>

                        <div class="text-sm">
                            {{ user.roleLabel }}
                        </div>

                        <div class="flex gap-2 mt-1 justify-end">
                            <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" (click)="onEdit(user)">
                            </p-button>

                            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                                (click)="onDelete(user)">
                            </p-button>
                        </div>
                    </div>
                </td>

                <!-- Desktop -->
                <td class="hidden md:table-cell">
                    {{ user.email }}
                </td>

                <td class="hidden md:table-cell">
                    {{ user.roleLabel }}
                </td>

                <td class="hidden md:table-cell">
                    <div class="flex justify-end gap-2">
                        <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" (click)="onEdit(user)">
                        </p-button>

                        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                            (click)="onDelete(user)">
                        </p-button>
                    </div>
                </td>

            </tr>
        </ng-template>

    </p-table>

    <p-confirmDialog></p-confirmDialog>

</div>
