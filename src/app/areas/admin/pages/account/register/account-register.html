<div class="card">
    <div class="font-semibold text-xl mb-4">Cadastro de usuário</div>

    <p-fluid>
        <form class="flex flex-col gap-4" [formGroup]="form">
            <div class="flex flex-col gap-2">
                <label for="name">Nome *</label>
                <input pInputText id="name" formControlName="name" type="text" />
                <app-validator [displayError]="isValidField('name', 'required')" errorMsg="Nome é obrigatório" />
            </div>

            <div class="flex flex-col gap-2">
                <label for="email">E-mail *</label>
                <input pInputText id="email" formControlName="email" type="email" />
                <app-validator [displayError]="isValidField('email', 'required')" errorMsg="E-mail é obrigatório" />
                <app-validator [displayError]="isValidField('email', 'email')" errorMsg="E-mail não é válido" />
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex flex-col gap-2 w-full">
                    <label for="password">Senha *</label>
                    <input pInputText id="password" formControlName="password" type="password" />
                    <app-validator [displayError]="isValidField('password', 'required')"
                        errorMsg="Senha é obrigatório" />
                </div>

                <div class="flex flex-col gap-2 w-full">
                    <label for="confirmPassword">Confirmar senha *</label>
                    <input pInputText id="confirmPassword" formControlName="confirmPassword" type="password" />
                    <app-validator [displayError]="isValidField('confirmPassword', 'required')"
                        errorMsg="Confirmar senha é obrigatório" />
                    <app-validator [displayError]="isValidField('confirmPassword', 'mustMatch')"
                        errorMsg="As senhas não coincidem" />
                </div>
            </div>

            <div class="flex justify-end">
                <button pButton label="Salvar" (click)="register()"></button>
            </div>
        </form>
    </p-fluid>
</div>
