<div class="card">

    <p-table #dt [value]="members()" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="id"
        currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} membros" [showCurrentPageReport]="true"
        [rowsPerPageOptions]="[10, 20, 30]">

        <ng-template pTemplate="caption">
            <div class="flex items-center justify-between">
                <h5 class="m-0">Membros</h5>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="fullName">
                    Nome
                    <p-sortIcon field="fullName"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell" pSortableColumn="email">
                    E-mail
                    <p-sortIcon field="email"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell" pSortableColumn="memberType">
                    Tipo
                    <p-sortIcon field="memberType"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell text-right" style="width: 110px;">
                </th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-member>
            <tr>

                <!-- Nome + Mobile -->
                <td>
                    <!-- Desktop -->
                    <div class="hidden md:block">
                        {{ member.fullName }}
                    </div>

                    <!-- Mobile -->
                    <div class="md:hidden">
                        <div class="font-bold">
                            {{ member.fullName }}
                        </div>

                        <div>
                            {{ member.email }}
                        </div>

                        <div class="text-sm">
                            {{ member.memberType }}
                        </div>

                        <div class="flex gap-2 mt-1 justify-end">
                            <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" (click)="onEdit(member)">
                            </p-button>

                            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                                (click)="onDelete(member)">
                            </p-button>
                        </div>
                    </div>
                </td>

                <!-- Desktop -->
                <td class="hidden md:table-cell">
                    {{ member.email }}
                </td>

                <td class="hidden md:table-cell">
                    {{ member.memberType }}
                </td>

                <td class="hidden md:table-cell">
                    <div class="flex justify-end gap-2">
                        <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" (click)="onEdit(member)">
                        </p-button>

                        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                            (click)="onDelete(member)">
                        </p-button>
                    </div>
                </td>

            </tr>
        </ng-template>

    </p-table>

    <p-confirmDialog></p-confirmDialog>

</div>
