<div class="card">

    <p-table #dt [value]="people()" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="id" sortField="fullName"
        [globalFilterFields]="['fullName', 'email']"
        currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} membros" [showCurrentPageReport]="true"
        [rowsPerPageOptions]="[10, 20, 30]">

        <ng-template pTemplate="caption">
            <div class="flex items-center justify-between">
                <h5 class="m-0">Membros</h5>
                <p-iconfield>
                    <p-inputicon class="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="nome, e-mail..." />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="fullName">
                    Nome
                    <p-sortIcon field="fullName"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell" pSortableColumn="email">
                    E-mail
                    <p-sortIcon field="email"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell" pSortableColumn="memberType">
                    Tipo
                    <p-sortIcon field="memberType"></p-sortIcon>
                </th>

                <th class="hidden md:table-cell text-right" style="width: 110px;">
                </th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-person>
            <tr>

                <!-- Nome + Mobile -->
                <td>
                    <!-- Desktop -->
                    <div class="hidden md:block">
                        {{ person.fullName }}
                    </div>

                    <!-- Mobile -->
                    <div class="md:hidden">
                        <div class="font-bold">
                            {{ person.fullName }}
                        </div>

                        <div>
                            {{ person.email }}
                        </div>

                        <div class="text-sm">
                            {{ person.memberTypeLabel }}
                        </div>

                        <div class="flex gap-2 mt-1 justify-end">
                            <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" (click)="onEdit(person)">
                            </p-button>

                            <p-button icon="pi pi-heart" [rounded]="true" [outlined]="true" pTooltip="Acompanhar pessoa"
                                (click)="onFollowUp(person)">
                            </p-button>

                            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                                (click)="onDelete(person)">
                            </p-button>
                        </div>
                    </div>
                </td>

                <!-- Desktop -->
                <td class="hidden md:table-cell">
                    {{ person.email }}
                </td>

                <td class="hidden md:table-cell">
                    {{ person.memberTypeLabel }}
                </td>

                <td class="hidden md:table-cell">
                    <div class="flex justify-end gap-2">
                        <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" (click)="onEdit(person)">
                        </p-button>

                        <p-button icon="pi pi-heart" [rounded]="true" [outlined]="true" pTooltip="Acompanhar pessoa"
                            (click)="onFollowUp(person)">
                        </p-button>

                        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                            (click)="onDelete(person)">
                        </p-button>
                    </div>
                </td>

            </tr>
        </ng-template>

    </p-table>

    <p-confirmDialog></p-confirmDialog>

</div>
