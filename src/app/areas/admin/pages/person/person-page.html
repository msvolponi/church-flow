<p-toolbar class="mb-6">
    <ng-template #start>

        <p-button label="Novo" icon="pi pi-plus" severity="secondary" (click)="onCreate()">
        </p-button>

    </ng-template>

</p-toolbar>

<app-person-list (edit)="onEdit($event)">
</app-person-list>

<p-dialog [(visible)]="dialog" [modal]="true" [style]="{ width: '740px' }" [closable]="true"
    header="Cadastro de pessoa">
    <app-person-form [person]="selected" (save)="onSaved()"></app-person-form>
</p-dialog>
